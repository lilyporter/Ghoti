[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pronouncedfish-engine"
version = "0.1.0"
description = "Local Pasketti phonetic recognition for PronouncedFish"
readme = "README.md"
requires-python = ">=3.9,<3.13"
dependencies = [
    "torch==2.6.0",
    "transformers==4.57.6",
    "numpy==1.26.4",
    "soundfile==0.13.1",
    "soxr==1.1.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "librosa==0.11.0"]

[project.scripts]
pronouncedfish-engine = "pronouncedfish_engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pronouncedfish_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires downloaded pretrained weights (opt-in)"]
